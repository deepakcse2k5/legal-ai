# Render Blueprint: New + > Blueprint > pick this repo. Fill in the two "sync: false" values when asked.
services:
  - type: web
    name: legal-ai
    runtime: docker
    plan: free            # change to "starter" for an always-on instance
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: cloudflare
      - key: EMBEDDINGS
        value: cloudflare
      - key: CF_ACCOUNT_ID
        sync: false
      - key: CF_API_TOKEN
        sync: false
      - key: API_KEY            # shared secret the website and legal-ui send as X-API-Key
        generateValue: true
